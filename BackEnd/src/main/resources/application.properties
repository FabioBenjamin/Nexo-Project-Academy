spring.application.name=nexus

# Suporte ao .env
spring.config.import=optional:file:.env[.properties],optional:file:./.env[.properties],optional:file:../.env[.properties]

# Configuração da Base de Dados PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexo_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Configuração JWT
jwt.key=${JWT_KEY:uma_chave_secreta_jwt_muito_longa_e_segura_123456}
jwt.secret=${JWT_KEY:uma_chave_secreta_jwt_muito_longa_e_segura_123456}

# Integração Gemini API
gemini.api.key=${GEMINI_API_KEY:sua_chave_aqui}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true